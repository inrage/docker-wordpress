name: Test command startup

on:
  workflow_call:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  command-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify publication scope
        run: ruby tests/publication-workflow.rb
      - name: Verify command and server startup
        run: ./tests/command-mode.sh
      - name: Verify effective Apache presets
        run: ./tests/presets.sh
