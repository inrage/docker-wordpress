name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wordpress-image-publication
  cancel-in-progress: false

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

jobs:
  test:
    uses: ./.github/workflows/test.yml
  generate-jobs:
    name: Generate Jobs
    runs-on: ubuntu-latest
    outputs:
      strategy: ${{ steps.generate-jobs.outputs.strategy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Generate Matrix
        id: generate-jobs
        run: |
          strategy="$("./matrix.sh")"
          echo "strategy=$strategy" >> "$GITHUB_OUTPUT"
          jq . <<<"$strategy" # sanity check / debugging aid
  build:
    name: ${{ matrix.name }}
    needs: [generate-jobs, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-jobs.outputs.strategy) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          tags: ${{ matrix.tag }}
          push: true
          pull: true
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-${{ matrix.name }}
  notify-consumers:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.INRBOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.INRBOT_APP_PRIVATE_KEY }}
          owner: inrage
          repositories: images
          permission-actions: write
      - name: Update WordPress consumers
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: gh workflow run renovate-wordpress.yml --repo inrage/images --ref main -f mode=update
